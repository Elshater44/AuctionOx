services:
  # ----------------------------------------------------
  # 1. SQL Server Database Service
  # ----------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auctionox-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AuctionOxP@ssw0rd!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AuctionOxP@ssw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - auctionox-network

  # ----------------------------------------------------
  # 2. AuctionOx API Service
  # ----------------------------------------------------
  api:
    image: auctionox-api
    build:
      context: ./AuctionOx
      dockerfile: Dockerfile
    container_name: auctionox-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AuctionOxDb;User Id=sa;Password=AuctionOxP@ssw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__Secret=SuperSecretDevKeyForAuctionOxProjectAtLeast32BytesLong!
      - JwtSettings__Issuer=AuctionOx
      - JwtSettings__Audience=AuctionOx
    ports:
      - "5050:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - auctionox-network

  # ----------------------------------------------------
  # 3. AuctionOx Frontend Service (React + Vite + Nginx)
  # ----------------------------------------------------
  frontend:
    image: auctionox-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auctionox-frontend
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - api
    networks:
      - auctionox-network

# ----------------------------------------------------
# Networks & Persistent Volumes
# ----------------------------------------------------
networks:
  auctionox-network:
    driver: bridge

volumes:
  mssql-data:
