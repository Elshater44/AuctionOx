name: AuctionOx CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build, Test & Push Container
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Restore dependencies
      - name: Restore NuGet packages
        run: dotnet restore

      # Step 4: Compile solution in Release mode
      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # Step 5: Execute all 28 tests using Testcontainers (real SQL Server on Ubuntu)
      - name: Run tests with Testcontainers
        env:
          JwtSettings__Secret: VerySecretTestingKeyWithAtLeast32BytesForHmacSha256!
          JwtSettings__Issuer: AuctionOxAPI
          JwtSettings__Audience: AuctionOxClients
          JwtSettings__ExpiryMinutes: "60"
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Step 6: Log in to Docker Hub (Only on push to master, when secrets exist)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build & Push Docker image to Docker Hub
      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./AuctionOx
          file: ./AuctionOx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auctionox-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/auctionox-api:${{ github.sha }}
