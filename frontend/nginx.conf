# ----------------------------------------------------
# Persistent On-Disk Image Cache Definition
# - levels=1:2 creates two-tier subdirectories
# - keys_zone=IMAGE_CACHE:10m allocates 10MB memory for cache keys (~80,000 keys)
# - max_size=2g enforces LRU disk eviction when cache exceeds 2 GB
# - inactive=30d evicts items not requested within 30 days
# - use_temp_path=off writes temp files directly into cache path
# ----------------------------------------------------
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=IMAGE_CACHE:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Allow up to 10MB for multipart image uploads
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Image Proxy & Disk Caching Layer
    # Uses ^~ to take precedence over static file regex matching
    location ^~ /api/images/ {
        proxy_pass http://api:8080/api/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache configuration
        proxy_cache IMAGE_CACHE;
        proxy_cache_key $uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;

        # Prevent Cache Stampede / Dogpiling: only 1 request fetches from upstream
        proxy_cache_lock on;
        proxy_cache_lock_age 10s;
        proxy_cache_lock_timeout 10s;

        # High-availability stale serving if backend is restarting/reloading
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Add cache diagnostic headers
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. General API Reverse Proxy (Bids, Auctions, Auth, Notifications)
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Swagger UI Reverse Proxy
    location ^~ /swagger/ {
        proxy_pass http://api:8080/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy SignalR WebSocket traffic to backend container
    location ^~ /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Frontend Client-side Routing (HTML5 pushState)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Static asset caching for built bundle (JS, CSS, icons)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
